<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.15"/>
    </pattern>
    <clipPath id="radar"><circle cx="0" cy="0" r="118"/></clipPath>
  </defs>

  <rect width="1200" height="290" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="290" rx="16" fill="url(#dots)"/>

  <!-- right: radar / shield -->
  <circle cx="990" cy="145" r="190" fill="url(#halo)">
    <animate attributeName="r" values="175;205;175" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(990 145)" fill="none" stroke-linecap="round">
    <circle r="118" stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle r="82" stroke="#22d3ee" stroke-opacity="0.3"/>
    <circle r="46" stroke="#22d3ee" stroke-opacity="0.25"/>
    <line x1="-118" y1="0" x2="118" y2="0" stroke="#22d3ee" stroke-opacity="0.15"/>
    <line x1="0" y1="-118" x2="0" y2="118" stroke="#22d3ee" stroke-opacity="0.15"/>
    <!-- sweeping scan -->
    <g clip-path="url(#radar)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        <path d="M0 0 L118 0 A118 118 0 0 0 83 -84 Z" fill="#22d3ee" fill-opacity="0.22" stroke="none"/>
        <line x1="0" y1="0" x2="118" y2="0" stroke="#22d3ee" stroke-width="2"/>
      </g>
    </g>
    <!-- anomaly blips -->
    <circle cx="48" cy="-52" r="5" fill="#f43f5e" stroke="none"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="-62" cy="30" r="4" fill="#f43f5e" stroke="none"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="22" cy="68" r="4" fill="#22d3ee" stroke="none"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <!-- shield -->
    <path d="M0 -22 L17 -14 V4 C17 15 9 22 0 26 C-9 22 -17 15 -17 4 V-14 Z" fill="#0a0f1c" stroke="url(#acc)" stroke-width="2.5"/>
    <path d="M-7 3 L-2 8 L8 -4" stroke="url(#acc)" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- text -->
  <text x="56" y="82" fill="#22d3ee" font-size="13" font-weight="600" letter-spacing="5">CYBERSECURITY &amp; DATA ANALYTICS</text>
  <text x="54" y="156" fill="#ffffff" font-size="68" font-weight="800">Eylül Nur</text>
  <text x="56" y="196" fill="#a5b4cc" font-size="19">3rd-Year MIS Student · SOC Monitoring · Threat Intelligence</text>
  <text x="56" y="222" fill="#7c8aa5" font-size="15">I turn raw network logs into clear, actionable security insights.</text>

  <!-- chips -->
  <g font-size="13" fill="#e2e8f0">
    <rect x="56" y="242" width="124" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="76" y="262">İstanbul, TR</text>
    <rect x="194" y="242" width="226" height="30" rx="15" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="214" cy="257" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="226" y="262">Python · SQL · Power BI</text>
    <rect x="434" y="242" width="172" height="30" rx="15" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.55"/>
    <circle cx="454" cy="257" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="466" y="262">Seeking internship</text>
  </g>

  <rect x="0" y="286" width="1200" height="4" fill="url(#acc)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
