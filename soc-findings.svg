<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="ddos" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="benign" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="400" rx="16" fill="#0a0f1c" stroke="#1e2a4a"/>
  <text x="32" y="44" fill="#ffffff" font-size="20" font-weight="700">DDoS vs Benign — Key Telemetry</text>
  <text x="32" y="68" fill="#7c8aa5" font-size="13">CICIDS2017 · 225,711 flows analyzed · SQLite + Python</text>

  <!-- legend -->
  <rect x="640" y="30" width="14" height="14" rx="3" fill="url(#ddos)"/>
  <text x="662" y="42" fill="#cbd5e1" font-size="13">DDoS</text>
  <rect x="725" y="30" width="14" height="14" rx="3" fill="url(#benign)"/>
  <text x="747" y="42" fill="#cbd5e1" font-size="13">Benign</text>

  <!-- 1. packet size -->
  <text x="32" y="110" fill="#e2e8f0" font-size="14" font-weight="600">Avg. packet size</text>
  <text x="868" y="110" fill="#fb923c" font-size="14" font-weight="700" text-anchor="end">≈ 3.3× larger</text>
  <rect x="32" y="120" width="0" height="22" rx="5" fill="url(#ddos)"><animate attributeName="width" from="0" to="640" dur="1.4s" fill="freeze" begin="0.1s"/></rect>
  <text x="680" y="137" fill="#cbd5e1" font-size="13">822.6 bytes</text>
  <rect x="32" y="148" width="0" height="22" rx="5" fill="url(#benign)"><animate attributeName="width" from="0" to="194" dur="1.4s" fill="freeze" begin="0.3s"/></rect>
  <text x="234" y="165" fill="#cbd5e1" font-size="13">249.7 bytes</text>

  <!-- 2. median duration -->
  <text x="32" y="212" fill="#e2e8f0" font-size="14" font-weight="600">Median flow duration</text>
  <text x="868" y="212" fill="#fb923c" font-size="14" font-weight="700" text-anchor="end">≈ 11× longer</text>
  <rect x="32" y="222" width="0" height="22" rx="5" fill="url(#ddos)"><animate attributeName="width" from="0" to="640" dur="1.4s" fill="freeze" begin="0.5s"/></rect>
  <text x="680" y="239" fill="#cbd5e1" font-size="13">1.88 s</text>
  <rect x="32" y="250" width="0" height="22" rx="5" fill="url(#benign)"><animate attributeName="width" from="0" to="58" dur="1.4s" fill="freeze" begin="0.7s"/></rect>
  <text x="98" y="267" fill="#cbd5e1" font-size="13">0.17 s</text>

  <!-- 3. class balance -->
  <text x="32" y="314" fill="#e2e8f0" font-size="14" font-weight="600">Class balance (dataset sample)</text>
  <rect x="32" y="324" width="0" height="26" rx="5" fill="url(#ddos)"><animate attributeName="width" from="0" to="484" dur="1.4s" fill="freeze" begin="0.9s"/></rect>
  <rect x="516" y="324" width="0" height="26" rx="5" fill="url(#benign)"><animate attributeName="width" from="0" to="352" dur="1.4s" fill="freeze" begin="1.1s"/></rect>
  <text x="274" y="342" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">56.7% DDoS</text>
  <text x="692" y="342" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">43.3% Benign</text>

  <text x="32" y="383" fill="#64748b" font-size="11">Class balance reflects the dataset sample, not a real-world traffic ratio.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
